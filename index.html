<!DOCTYPE html>
<html lang="ru">
<head><meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qarajat">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192-v2.png
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512-v2.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E13">
<title>Qarajat — Тиыннан теңге құралар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0A0E13;--bg2:#0F141A;--surface:#141B24;--surface2:#1B242F;--surface3:#222D3A;
  --line:#26313E;--text:#EDF2F7;--muted:#7C8DA0;--muted2:#57667A;
  --accent:#00E29A;--blue:#4B9EFF;--violet:#B794F6;--red:#FF5B6E;--warn:#FFB547;
  --grad-hero:linear-gradient(135deg,#00E29A 0%,#4B9EFF 100%);
  --grad-violet:linear-gradient(135deg,#B794F6 0%,#4B9EFF 100%);
  --grad-danger:linear-gradient(135deg,#FF5B6E 0%,#FF7EA8 100%);
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --nav-h:72px;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F4F6FA;--bg2:#FFF;--surface:#FFF;--surface2:#F7F9FC;--surface3:#EDF1F7;
  --line:#E3E8EF;--text:#0E1620;--muted:#697586;--muted2:#8A96A6;
  --accent:#00B87A;--blue:#2E7DFF;--violet:#8B5CF6;--red:#E63946;--warn:#E8930C;
  --shadow:0 8px 28px rgba(15,25,40,.08);
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;transition:background .25s,color .25s;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
h1,h2,h3,.num{font-family:'Manrope','Inter',sans-serif;font-weight:700;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}

/* ============== APP LAYOUT ============== */
.app{
  max-width:480px;margin:0 auto;min-height:100vh;
  padding:0 0 calc(var(--nav-h) + 100px);
  position:relative;
}
/* Резерв под последним элементом — чтобы ничего не пряталось за меню */
#view::after{content:'';display:block;height:80px}

@media(min-width:520px){
  body{background:var(--bg2)}
  .app{box-shadow:0 0 0 1px var(--line);padding-bottom:calc(var(--nav-h) + 120px)}
}

/* ============== TOPBAR ============== */
.topbar{
  display:flex;align-items:center;gap:12px;padding:14px 18px 10px;
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent;
}
[data-theme="light"] .topbar{background:rgba(255,255,255,.8)}
.topbar.scrolled{border-bottom-color:var(--line)}
.avatar-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--grad-hero);color:#04140e;
  display:grid;place-items:center;font-weight:800;font-size:17px;
  font-family:'Manrope',sans-serif;flex:none;
  overflow:hidden;position:relative;transition:.15s;
  cursor:pointer;border:2px solid transparent;padding:0;
}
.avatar-btn:hover{border-color:var(--accent)}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}
.topbar .info{flex:1;min-width:0}
.topbar .info small{color:var(--muted);font-size:11.5px;font-weight:500;display:block}
.topbar .info b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:16px;
  transition:.15s;cursor:pointer;padding:0;
}
.icon-btn:hover{color:var(--text)}
.icon-btn:active{transform:scale(.94)}

/* ============== HERO ============== */
.hero{
  margin:6px 16px 16px;padding:22px;border-radius:22px;
  background:var(--grad-hero);color:#04140e;position:relative;overflow:hidden;
  box-shadow:0 12px 36px rgba(0,226,154,.28);
}
.hero::before{content:'';position:absolute;top:-40%;right:-20%;width:80%;height:180%;
  background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);pointer-events:none}
.hero .lbl{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;opacity:.75}
.hero .amount{font-size:38px;font-weight:800;letter-spacing:-1.2px;margin-top:6px;line-height:1.05}
.hero .sub{font-size:12px;opacity:.75;margin-top:5px;font-weight:500}
.hero .stats{display:flex;gap:20px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(4,20,14,.16)}
.hero .stats > div{flex:1}
.hero .stats small{font-size:11px;opacity:.72;font-weight:600;display:block}
.hero .stats b{display:block;font-size:16px;font-weight:800;margin-top:2px;letter-spacing:-.3px}

/* ============== SCROLLER ============== */
.scroller{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:4px 16px 20px;margin:0 -16px;scrollbar-width:none;
}
.scroller::-webkit-scrollbar{display:none}
.scroller > *{scroll-snap-align:start;flex:0 0 66%;}
.scroller > *:last-child{margin-right:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:104px}
.tile .l{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .v{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.tile.flex{display:flex;align-items:center;gap:14px}

/* ============== RING ============== */
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring svg circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-family:'Manrope',sans-serif}

/* ============== SECTIONS ============== */
.section{padding:0 16px;margin-bottom:22px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh h2{font-size:16px;font-weight:800;letter-spacing:-.2px}
.sh .link{font-size:13px;color:var(--accent);font-weight:600;cursor:pointer}

/* ============== CARD ============== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}

/* ============== LIST ROWS ============== */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.row[data-nav],.row[data-act]{cursor:pointer;transition:.15s}
.row[data-nav]:active,.row[data-act]:active{transform:scale(.985)}
.row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  font-size:18px;background:var(--surface3);flex:none}
.row .b{flex:1;min-width:0}
.row .b b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b small{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:'Manrope',sans-serif;font-weight:700;font-size:14.5px;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--accent)}.neg{color:var(--red)}.warnc{color:var(--warn)}.violet{color:var(--violet)}

/* ============== BUTTONS ============== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;
  background:var(--surface2);color:var(--text);border:1px solid var(--line);
  transition:.15s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad-hero);color:#04140e;border:none;
  box-shadow:0 8px 20px rgba(0,226,154,.28)}
.btn.danger{background:var(--grad-danger);color:#fff;border:none}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:12px}
.btn.lg{padding:15px 22px;font-size:15px}

/* ============== FORMS ============== */
.form{display:grid;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:12px;color:var(--muted);font-weight:600}
.input,input,select,textarea{
  background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:12px 14px;font-size:15px;width:100%;outline:none;
  transition:.15s;-webkit-appearance:none;appearance:none;
}
[data-theme="light"] .input,[data-theme="light"] input,[data-theme="light"] select,[data-theme="light"] textarea{
  background:var(--surface2);
}
.input:focus,input:focus,select:focus,textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,226,154,.15);
}
.r2{display:grid;gap:11px;grid-template-columns:1fr 1fr}

/* ============================================================
   ФИКС ЧЕКБОКСОВ — отдельный стиль
   ============================================================ */
input[type="checkbox"],
input[type="radio"]{
  -webkit-appearance:auto !important;
  appearance:auto !important;
  width:22px !important;
  height:22px !important;
  min-width:22px;
  max-width:22px;
  padding:0 !important;
  margin:0;
  border:1.5px solid var(--line) !important;
  border-radius:6px !important;
  background:var(--surface2) !important;
  box-shadow:none !important;
  cursor:pointer;
  flex:none;
  accent-color:var(--accent);
  transition:border-color .15s, background .15s, transform .1s;
}
input[type="radio"]{border-radius:50% !important}
input[type="checkbox"]:hover,
input[type="radio"]:hover{border-color:var(--accent) !important}
input[type="checkbox"]:checked,
input[type="radio"]:checked{
  background:var(--accent) !important;
  border-color:var(--accent) !important;
}
input[type="checkbox"]:active,
input[type="radio"]:active{transform:scale(.92)}
input[type="checkbox"]:focus-visible,
input[type="radio"]:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* Строки с чекбоксами */
.notif-row{
  display:flex;align-items:center;gap:12px;padding:12px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;
  transition:background .15s;
}
.notif-row:last-child{border-bottom:none}
.notif-row:hover{background:var(--surface2)}
.notif-row span{font-size:14px;font-weight:500;user-select:none;flex:1}

/* ============== SEG ============== */
.seg{display:flex;gap:6px;padding:4px;background:var(--surface2);
  border-radius:14px;border:1px solid var(--line);overflow-x:auto}
.seg button{flex:1;min-width:80px;padding:9px 12px;border-radius:10px;
  font-size:13px;font-weight:600;color:var(--muted);transition:.18s;white-space:nowrap;
  font-family:inherit;cursor:pointer}
.seg button.on{background:var(--text);color:var(--bg)}

/* ============== TAGS ============== */
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;
  font-size:10.5px;font-weight:700;background:var(--surface3);color:var(--muted)}
.tag.g{background:rgba(0,226,154,.14);color:var(--accent)}
.tag.r{background:rgba(255,91,110,.14);color:var(--red)}
.tag.y{background:rgba(255,181,71,.14);color:var(--warn)}
.tag.b{background:rgba(75,158,255,.14);color:var(--blue)}
.tag.v{background:rgba(183,148,246,.14);color:var(--violet)}

/* ============== BOTTOM NAV ============== */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  max-width:480px;margin:0 auto;
  background:color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;
  align-items:end;
  padding:8px 4px max(12px, env(safe-area-inset-bottom));
  height:var(--nav-h);
}
[data-theme="light"] .bottomnav{background:rgba(255,255,255,.85)}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font-size:10.5px;font-weight:600;padding:6px 2px;
  transition:.15s;position:relative;cursor:pointer;font-family:inherit}
.bottomnav button .bi{font-size:22px;line-height:1;transition:.2s}
.bottomnav button.on{color:var(--accent)}
.bottomnav .add-btn{width:60px;height:60px;border-radius:50%;
  background:var(--grad-hero);color:#04140e;display:grid;place-items:center;
  font-size:28px;font-weight:800;box-shadow:0 10px 26px rgba(0,226,154,.4);
  align-self:center;transition:.15s;border:none;cursor:pointer}
.bottomnav .add-btn:active{transform:scale(.92)}
.bottomnav .badge{position:absolute;top:0;right:24%;background:var(--red);color:#fff;
  font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px;line-height:1.3}

/* ============== FAB AI ============== */
.fab-ai{
  position:fixed;right:calc(50% - 240px + 16px);bottom:calc(var(--nav-h) + 16px);z-index:65;
  width:56px;height:56px;border-radius:50%;
  background:var(--grad-violet);color:#fff;font-size:24px;display:grid;place-items:center;
  box-shadow:0 12px 32px rgba(183,148,246,.5);transition:.2s;border:none;cursor:pointer;
  animation:pulse 2.6s infinite;
}
@media(max-width:512px){.fab-ai{right:16px}}
.fab-ai:active{transform:scale(.92)}
@keyframes pulse{
  0%,100%{box-shadow:0 12px 32px rgba(183,148,246,.4),0 0 0 0 rgba(183,148,246,.5)}
  50%{box-shadow:0 12px 32px rgba(183,148,246,.5),0 0 0 12px rgba(183,148,246,0)}
}
.fab-ai .dot{position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg)}

/* ============== SHEET ============== */
.backdrop{position:fixed;inset:0;z-index:150;background:rgba(4,8,12,.55);
  backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.25s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:160;max-width:480px;margin:0 auto;
  background:var(--bg);border-top:1px solid var(--line);
  border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;
  padding:8px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -12px 40px rgba(0,0,0,.3);
}
.sheet.open{transform:translateY(0)}
.sheet .handle{width:40px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 16px}
.sheet h3{font-size:18px;margin-bottom:14px;letter-spacing:-.2px}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1}

/* ============== AI CHAT ============== */
.ai-sheet{position:fixed;inset:0;z-index:200;max-width:480px;margin:0 auto;
  background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.ai-sheet.open{transform:translateY(0)}
.ai-head{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.ai-head .ava{width:44px;height:44px;border-radius:14px;background:var(--grad-violet);
  display:grid;place-items:center;font-size:22px;flex:none}
.ai-head .meta{flex:1;min-width:0}
.ai-head .meta b{display:block;font-size:15px;font-weight:800}
.ai-head .meta small{font-size:11.5px;color:var(--muted)}
.ai-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;
  word-wrap:break-word;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ai-msg.user{align-self:flex-end;background:var(--grad-hero);color:#04140e;
  border-bottom-right-radius:6px;font-weight:500}
.ai-msg.bot{align-self:flex-start;background:var(--surface);
  border:1px solid var(--line);border-bottom-left-radius:6px}
.ai-msg.bot b{color:var(--violet)}
.ai-msg .src{display:block;font-size:10.5px;color:var(--muted2);margin-top:6px;
  padding-top:6px;border-top:1px dashed var(--line)}
.ai-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.ai-sugg button{padding:7px 13px;border-radius:99px;font-size:12px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;
  font-family:inherit}
.ai-input-row{display:flex;gap:8px;align-items:flex-end;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.ai-input-row textarea{background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:11px 14px;resize:none;min-height:44px;max-height:110px}
.ai-input-row .send{width:44px;height:44px;border-radius:50%;flex:none;
  background:var(--grad-hero);color:#04140e;font-size:18px;font-weight:800;
  display:grid;place-items:center;border:none;cursor:pointer}
.ai-input-row .send:active{transform:scale(.92)}

/* ============== TOAST ============== */
.toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  box-shadow:var(--shadow);animation:toastIn .3s ease;
  max-width:340px;text-align:center;
}
.toast.g{border-color:rgba(0,226,154,.4);background:rgba(0,226,154,.1);color:var(--accent)}
.toast.r{border-color:rgba(255,91,110,.4);background:rgba(255,91,110,.1);color:var(--red)}
.toast.y{border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.1);color:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ============== MISC ============== */
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:36px 20px;line-height:1.6}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  cursor:pointer;font-family:inherit;transition:.15s}
.pill.on{background:var(--text);color:var(--bg);border-color:transparent}

/* ============== CALENDAR ============== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;
  text-align:center;font-size:10.5px;color:var(--muted);font-weight:700}
.cal-day{
  aspect-ratio:1;border-radius:11px;background:var(--surface2);
  padding:5px 4px;font-size:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;cursor:pointer;
  transition:.15s;border:1px solid transparent;position:relative;
}
.cal-day:hover{background:var(--surface3)}
.cal-day.today{background:rgba(0,226,154,.16);border-color:rgba(0,226,154,.5)}
.cal-day.today b{color:var(--accent)}
.cal-day.sel{background:var(--accent);border-color:transparent}
.cal-day.sel b{color:#04140e}
.cal-day.empty-day{background:transparent;cursor:default;opacity:0}
.cal-day b{font-weight:700;font-size:12px}
.cal-day .dots{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap;justify-content:center}
.cal-day .dot{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cal-day .dot.d{background:var(--warn)}
.cal-day .dot.r{background:var(--violet)}
.cal-day .dot.o{background:var(--blue)}

/* ============== PROFILE AVATAR ============== */
.profile-av{
  width:100px;height:100px;border-radius:50%;
  background:var(--grad-violet);color:#fff;
  display:grid;place-items:center;font-size:40px;font-weight:800;
  font-family:'Manrope',sans-serif;position:relative;overflow:hidden;
  margin:0 auto;border:3px solid var(--line);
}
.profile-av img{width:100%;height:100%;object-fit:cover;display:block}
.profile-av .edit-badge{
  position:absolute;bottom:0;right:0;width:32px;height:32px;border-radius:50%;
  background:var(--grad-hero);color:#04140e;font-size:14px;

/* ============================================================

function accountBalance(id){
  const acc=state.accounts.find(a=>a.id===id);if(!acc)return 0;
  let bal=acc.initial;
  const ops=[...state.operations].sort((a,b)=>a.date.localeCompare(b.date));
  for(const op of ops){
    if(op.status==='cancel'||op.status==='plan')continue;
    if(op.type==='income'&&op.accountId===id)bal+=op.amount;
    if(op.type==='expense'&&op.accountId===id)bal-=op.amount;
    if(op.type==='transfer'){
      if(op.accountId===id)bal-=op.amount;
      if(op.toAccountId===id)bal+=op.amount;
    }
    if(op.type==='adjust'&&op.accountId===id)bal=op.amount;
  }
  return bal;
}
function rangeFor(period){
  const now=new Date();
  let from,to=todayISO();
  if(period==='today')from=todayISO();
  else if(period==='week')from=dShift(-6);
  else if(period==='month')from=dShift(-29);
  else if(period==='year')from=dShift(-364);
  else if(period==='prev_month'){
    const fm=new Date(now.getFullYear(),now.getMonth()-1,1);
    const tm=new Date(now.getFullYear(),now.getMonth(),0);
    from=fm.toISOString().slice(0,10);to=tm.toISOString().slice(0,10);
  } else from=dShift(-29);
  return {from,to};
}
function aggRange(period){
  const {from,to}=rangeFor(period);
  const done=state.operations.filter(o=>o.status==='done'&&o.date>=from&&o.date<=to);
  const inc=done.filter(o=>o.type==='income').reduce((s,o)=>s+o.amount,0);
  const exp=done.filter(o=>o.type==='expense').reduce((s,o)=>s+o.amount,0);
  return {inc,exp,net:inc-exp,from,to,done};
}
const inLastDays=(d,n)=>{const diff=(new Date()-parseD(d))/86400000;return diff>=0&&diff<=n};
function nextDateForDay(day){
  const now=new Date();
  let d=new Date(now.getFullYear(),now.getMonth(),day);
  if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))
    d=new Date(now.getFullYear(),now.getMonth()+1,day);
  return d;
}
function daysUntilSalary(){
  const now=new Date();const sd=state.settings.salaryDay||5;
  let d=new Date(now.getFullYear(),now.getMonth(),sd);
  if(d<=now)d=new Date(now.getFullYear(),now.getMonth()+1,sd);
  return Math.max(1,Math.ceil((d-now)/86400000));
}
function debtMonths(d){
  if(d.balance<=0)return 0;
  if(!d.minPayment||d.minPayment<=0)return Infinity;
  const r=(d.rate||0)/100/12;
  if(r===0)return Math.ceil(d.balance/d.minPayment);
  if(d.minPayment<=d.balance*r)return Infinity;
  return Math.ceil(-Math.log(1-d.balance*r/d.minPayment)/Math.log(1+r));
}
const debtInterest=d=>d.balance*((d.rate||0)/100/12);
const debtBody=d=>Math.max(0,Math.min(d.minPayment,d.balance)-debtInterest(d));
const debtProgress=d=>d.initial<=0?0:clamp((1-d.balance/d.initial)*100,0,100);
function advanceRecurring(date,interval,dayOfMonth){
  const d=new Date(date);
  if(interval==='weekly')d.setDate(d.getDate()+7);
  else if(interval==='monthly'){
    d.setMonth(d.getMonth()+1);
    if(dayOfMonth)d.setDate(Math.min(dayOfMonth,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
  } else if(interval==='yearly')d.setFullYear(d.getFullYear()+1);
  else d.setDate(d.getDate()+30);
  return d;
}
function recurringInRange(from,to){
  const list=[];
  state.recurring.filter(r=>r.status!=='stopped').forEach(r=>{
    let d=parseD(r.nextDate);
    const fromD=parseD(from),toD=parseD(to);
    let safety=0;
    while(d<fromD&&safety<500){d=advanceRecurring(d,r.interval,r.dayOfMonth);safety++}
    while(d<=toD&&safety<500){
      list.push({id:'rec-'+r.id+'-'+d.toISOString().slice(0,10),date:d.toISOString().slice(0,10),
        title:r.name,type:'Расход',amount:r.amount,accountId:r.accountId,
        kind:'recurring',refId:r.id,status:'pending'});
      d=advanceRecurring(d,r.interval,r.dayOfMonth);safety++;
    }
  });
  return list;
}
function scoreBreakdown(M){
  const period=aggRange('month');
  const mi=period.inc||state.settings.expectedIncome||1;
  const ratio=mi>0?(period.inc-period.exp)/mi:0;
  const f1=clamp((ratio+0.1)/0.5*100,0,100);
  const f2=clamp(100-M.debtLoad*1.6,0,100);
  const f3=clamp(M.cushionMonths/6*100,0,100);
  const f4=clamp(M.savingsRate/25*50+M.goalProgress/100*50,0,100);
  const today=new Date().getDate();
  const overdue=state.debts.filter(d=>d.status==='active'&&d.payDay<today&&d.payDay>=today-7&&d.balance>0).length;
  const totalDebts=state.debts.filter(d=>d.status==='active').length||1;
  const f5=clamp(100-overdue/totalDebts*100,0,100);
  const score=Math.round(f1*.25+f2*.25+f3*.20+f4*.15+f5*.15);
  return {total:clamp(score,0,100),factors:[
    {name:'Доходы / расходы',value:Math.round(f1),weight:25,desc:`Профицит ${(ratio*100).toFixed(0)}%`},
    {name:'Долги',value:Math.round(f2),weight:25,desc:`Нагрузка ${M.debtLoad.toFixed(0)}%`},
    {name:'Резерв',value:Math.round(f3),weight:20,desc:`Подушка ${M.cushionMonths.toFixed(1)} мес.`},
    {name:'Накопления',value:Math.round(f4),weight:15,desc:`SR ${M.savingsRate.toFixed(0)}%`},
    {name:'Дисциплина',value:Math.round(f5),weight:15,desc:`Просрочек ${overdue}`}
  ]};
}
function metrics(){
  const bal={};state.accounts.forEach(a=>bal[a.id]=accountBalance(a.id));
  const avail=state.accounts.filter(a=>a.kind==='available').reduce((s,a)=>s+bal[a.id],0);
  const savings=state.accounts.filter(a=>a.kind==='savings').reduce((s,a)=>s+bal[a.id],0);
  const invest=state.accounts.filter(a=>a.kind==='investment').reduce((s,a)=>s+bal[a.id],0);
  const assets=avail+savings+invest;
  const activeDebts=state.debts.filter(d=>d.status!=='closed');
  const debtTotal=activeDebts.reduce((s,d)=>s+d.balance,0);
  const netWorth=assets-debtTotal;
  const done=state.operations.filter(o=>o.status==='done');
  const income30=done.filter(o=>o.type==='income'&&inLastDays(o.date,30)).reduce((s,o)=>s+o.amount,0);
  const expense30=done.filter(o=>o.type==='expense'&&inLastDays(o.date,30)).reduce((s,o)=>s+o.amount,0);
  const savedToAcc=done.filter(o=>o.type==='transfer'&&inLastDays(o.date,30)&&
    ['savings','investment'].includes((state.accounts.find(a=>a.id===o.toAccountId)||{}).kind))
    .reduce((s,o)=>s+o.amount,0);
  const mi=income30||state.settings.expectedIncome||1;
  const savingsRate=income30>0?clamp((savedToAcc>0?savedToAcc:Math.max(0,income30-expense30))/income30*100,0,100):0;
  const debtMonthly=activeDebts.reduce((s,d)=>s+(d.minPayment||0),0);
  const debtLoad=mi>0?debtMonthly/mi*100:0;
  let nearest=null;
  activeDebts.forEach(d=>{const dt=nextDateForDay(d.payDay||1);if(!nearest||dt<nearest.date)nearest={debt:d,date:dt}});
  const daysLeft=daysUntilSalary();
  const salaryDate=new Date(Date.now()+daysLeft*86400000);
  const upcomingBeforeSalary=activeDebts.filter(d=>nextDateForDay(d.payDay||1)<=salaryDate).reduce((s,d)=>s+(d.minPayment||0),0);
  const plannedExpenses=state.operations.filter(o=>o.status==='plan'&&o.type==='expense'&&
    parseD(o.date)>=new Date()&&parseD(o.date)<=salaryDate).reduce((s,o)=>s+o.amount,0);
  const recBeforeSalary=recurringInRange(todayISO(),salaryDate.toISOString().slice(0,10))
    .reduce((s,r)=>s+r.amount,0);
  const reserve=(state.settings.reserveForGoals||0)+(state.settings.minReserve||0);
  const freeMoney=avail-upcomingBeforeSalary-plannedExpenses-recBeforeSalary-reserve;
  const safeToSpend=Math.max(0,freeMoney)/daysLeft;
  const cushionMonths=expense30>0?avail/expense30:0;
  const goalProgress=state.goals.length
    ?state.goals.reduce((s,g)=>s+clamp(g.saved/g.target*100,0,100),0)/state.goals.length:0;
  const maxMonths=activeDebts.reduce((m,d)=>Math.max(m,debtMonths(d)),0);
  const freedomDate=maxMonths===Infinity?null:new Date(new Date().setMonth(new Date().getMonth()+maxMonths));
  const forecast=avail-upcomingBeforeSalary-plannedExpenses-recBeforeSalary;
  const M={bal,avail,savings,invest,assets,debtTotal,netWorth,income30,expense30,monthlyIncome:mi,
    savingsRate,debtLoad,debtMonthly,nearest,daysLeft,upcomingBeforeSalary,plannedExpenses,
    recBeforeSalary,reserve,safeToSpend,cushionMonths,goalProgress,maxMonths,freedomDate,forecast};
  M.scoreBreakdown=scoreBreakdown(M);
  M.score=M.scoreBreakdown.total;
  return M;
}

let sheetCallback=null;
function openSheet(title,html,onSubmit){
  $('#sheetTitle').textContent=title;
  $('#sheetForm').innerHTML=html+`
    <div class="sheet-actions">
      <button type="button" class="btn ghost" data-act="close-sheet">Отмена</button>
      <button type="submit" class="btn primary">Сохранить</button>
    </div>`;
  sheetCallback=onSubmit;
  $('#sheet').classList.add('open');
  $('#backdrop').classList.add('open');
  const firstInput=$('#sheetForm input:not([type=hidden]):not([type=checkbox]):not([readonly]),#sheetForm select,#sheetForm textarea');
  if(firstInput)setTimeout(()=>firstInput.focus(),120);
  pushLayer('sheet',closeSheet);
}
function closeSheet(){
  $('#sheet').classList.remove('open');
  $('#backdrop').classList.remove('open');
  sheetCallback=null;
  for(let i=layers.length-1;i>=0;i--){
    if(layers[i].name==='sheet'){layers.splice(i,1);break}
  }
}
$('#sheetForm').addEventListener('submit',e=>{
  e.preventDefault();
  const data=Object.fromEntries(new FormData(e.target).entries());
  if(sheetCallback){
    const fn=sheetCallback;
    sheetCallback=null;
    fn(data);
    closeSheet();
  }
});
$('#backdrop').onclick=()=>closeSheet();

/* ============================================================
   RING SVG
   ============================================================ */
function ringSVG(pct,size,stroke,color,label){
  const r=(size-stroke)/2;
  const c=2*Math.PI*r;
  const off=c*(1-clamp(pct,0,100)/100);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
        stroke="var(--surface3)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
        stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    </svg>
    ${label!=null?`<div class="in" style="color:${color}">${label}</div>`:''}
  </div>`;
}

function calendarEvents(){
  const events=[];
  const now=new Date();
  const y=now.getFullYear(),mo=now.getMonth();
  const first=new Date(y,mo,1),last=new Date(y,mo+1,0);
  const from=first.toISOString().slice(0,10),to=last.toISOString().slice(0,10);
  state.debts.filter(d=>d.status!=='closed').forEach(d=>{
    for(let i=0;i<2;i++){
      const dt=new Date(y,mo+i,clamp(d.payDay||1,1,31));
      if(dt<first||dt>last)continue;
      events.push({id:'debt-'+d.id+'-'+i,date:dt.toISOString().slice(0,10),
        title:d.name,type:d.type,amount:d.minPayment,kind:'debt',refId:d.id});
    }
  });
  state.operations.filter(o=>o.status==='plan'&&o.date>=from&&o.date<=to).forEach(o=>{
    events.push({id:'op-'+o.id,date:o.date,title:o.category||'Плановая',
      type:o.type==='expense'?'Расход':o.type==='income'?'Доход':'Перевод',
      amount:o.amount,kind:'op',refId:o.id});
  });
  recurringInRange(from,to).forEach(r=>events.push(r));
  state.events.filter(e=>e.date>=from&&e.date<=to).forEach(e=>{
    events.push({id:'ev-'+e.id,date:e.date,title:e.title,type:'Событие',
      amount:e.amount||0,kind:'event',refId:e.id,comment:e.comment||''});
  });
  return events.sort((a,b)=>a.date.localeCompare(b.date));
}

function pageCalendar(){
  const now=new Date();
  const y=now.getFullYear(),mo=now.getMonth();
  const firstDayIdx=(new Date(y,mo,1).getDay()+6)%7;
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const today=todayISO();
  const sel=state.ui.calSel||today;
  const events=calendarEvents();
  const byDay={};
  events.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e)});

  const days=[];
  for(let i=0;i<firstDayIdx;i++)days.push(null);
  for(let d=1;d<=daysInMonth;d++)days.push(d);

  const selEvents=byDay[sel]||[];

  return `
  <div class="section" style="padding-top:6px">
    <h2 style="font-size:17px;margin-bottom:14px">${MONTHS_FULL[mo]} ${y}</h2>
    <div class="card" style="padding:14px">

      </div>
      <div class="cal">
        ${days.map(d=>{
          if(d===null)return '<div class="cal-day empty-day"></div>';
          const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const evs=byDay[ds]||[];
          const isToday=ds===today;
          const isSel=ds===sel;
          const dots=evs.slice(0,4).map(e=>{
            const cls=e.kind==='debt'?'d':e.kind==='recurring'?'r':e.kind==='event'?'o':'';
            return `<span class="dot ${cls}"></span>`;
          }).join('');
          return `<div class="cal-day ${isToday?'today':''} ${isSel?'sel':''}" data-cal-day="${ds}" role="button" tabindex="0">
            <b>${d}</b>
            ${dots?`<div class="dots">${dots}</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="sh" style="margin-top:16px">
      <h2>${fmtDate(sel)}</h2>
      <button class="btn sm primary" data-act="add-to-date" data-date="${sel}" type="button">＋ Добавить</button>
    </div>

    ${selEvents.length?selEvents.map(e=>{
      const icon=e.kind==='debt'?'🏦':e.kind==='recurring'?'🔁':
        e.kind==='event'?'📌':'💸';
      const isEditable=e.kind==='event'||e.kind==='op';
      return `<div class="row" ${isEditable?`data-act="edit-cal-event" data-kind="${e.kind}" data-id="${e.refId}"`:''}>
        <div class="ic">${icon}</div>
        <div class="b">
          <b>${esc(e.title)}</b>
          <small>${esc(e.type)}${e.comment?' · '+esc(e.comment):''}</small>
        </div>
        ${e.amount?`<div class="amt num">${money(e.amount)}</div>`:''}
      </div>`;
    }).join(''):'<div class="empty">Нет событий<br>Нажми «Добавить» чтобы создать</div>'}

    <h3 style="font-size:14px;margin:20px 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px">Все события месяца (${events.length})</h3>
    ${events.slice(0,20).map(e=>{
      const icon=e.kind==='debt'?'🏦':e.kind==='recurring'?'🔁':e.kind==='event'?'📌':'💸';
      return `<div class="row" data-cal-go="${e.date}">
        <div class="ic">${icon}</div>
        <div class="b"><b>${esc(e.title)}</b>
          <small>${fmtDM(e.date)} · ${esc(e.type)}</small></div>
        ${e.amount?`<div class="amt num">${money(e.amount)}</div>`:''}
      </div>`;
    }).join('')}

}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  document.documentElement.setAttribute('data-theme',state.theme||'dark');
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta)meta.content=state.theme==='dark'?'#0A0E13':'#F4F6FA';

  renderTopbar();
  renderNav();

  const tab=state.ui.tab;
  const v=$('#view');
  let html='';
  switch(tab){
    case 'dashboard': html=pageDashboard(); break;
    case 'operations': html=pageOperations(); break;
    case 'analytics': html=pageAnalytics(); break;
    case 'calendar': html=pageCalendar(); break;
    case 'categories': html=pageCategories(); break;
    case 'accounts': html=pageAccounts(); break;
    case 'debts': html=pageDebts(); break;
    case 'goals': html=pageGoals(); break;
    case 'capital': html=pageCapital(); break;
    case 'notifications': html=pageNotifications(); break;
    case 'profile': html=pageProfile(); break;
    case 'more': html=pageMore(); break;
    default: html=pageDashboard();
  }
  v.innerHTML=html;

  window.removeEventListener('scroll',onScroll);
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();
}
function onScroll(){
  const tb=$('.topbar');
  if(tb)tb.classList.toggle('scrolled',window.scrollY>4);
}

/* ============================================================
   GLOBAL CLICK DELEGATION
   ============================================================ */
document.addEventListener('click',function(e){
  const t=e.target;
  if(!t||!t.closest)return;

  const el=t.closest('[data-act],[data-nav],[data-cal-day],[data-cal-go],[data-ftype],[data-period]');
  if(!el)return;

  if(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'){
    if(t.type==='checkbox')return;
  }

  e.preventDefault();

  const act=el.dataset.act;
  const nav=el.dataset.nav;
  const calDay=el.dataset.calDay;
  const calGo=el.dataset.calGo;
  const ftype=el.dataset.ftype;
  const period=el.dataset.period;
  const id=el.dataset.id;
  const kind=el.dataset.kind;
  const type=el.dataset.type;

  if(nav){go(nav);return}
  if(calDay){state.ui.calSel=calDay;save();render();return}
  if(calGo){state.ui.calSel=calGo;save();render();return}
  if(ftype!==undefined&&el.hasAttribute('data-ftype')){
    state.ui.filters.type=ftype;save();render();return;
  }
  if(period){state.ui.analyticsPeriod=period;save();render();return}

  switch(act){
    case 'quick-add': openQuickAdd(); return;
    case 'close-sheet': closeSheet(); return;
    case 'toggle-theme':
      state.theme=state.theme==='dark'?'light':'dark';
      save();render();toast('Тема: '+(state.theme==='dark'?'тёмная':'светлая'),'g');return;
    case 'open-avatar': openAvatarPicker(); return;

/* ============================================================
   KEYBOARD — ESC / Insert / Backspace / Cmd+N
   ============================================================ */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(closeTop()){e.preventDefault();return}
    if(state.ui.tab!=='dashboard'){
      e.preventDefault();
      go('dashboard');
    }
    return;
  }
  if(e.key==='Insert'){
    e.preventDefault();
    openQuickAdd();
    return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){
    e.preventDefault();
    openQuickAdd();
    return;
  }
  if(e.key==='Backspace'&&
     !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&
     state.ui.tab!=='dashboard'){
    e.preventDefault();
    go('dashboard');
    return;
  }
});

   AVATAR
   ============================================================ */
function openAvatarPicker(){
  $('#avatarInput').value='';
  $('#avatarInput').click();
}
$('#avatarInput').addEventListener('change',function(e){
  const file=e.target.files[0];
  if(!file)return;
  const okTypes=['image/jpeg','image/jpg','image/png','image/webp'];
  if(!okTypes.includes(file.type)){
    toast('Поддерживаются JPG, PNG, WEBP','r');
    return;
  }
  if(file.size>4*1024*1024){
    toast('Файл слишком большой (макс. 4 МБ)','r');
    return;
  }
  const reader=new FileReader();
  reader.onload=ev=>{
    const dataUrl=ev.target.result;
    compressImage(dataUrl,320,0.85,function(out){
      state.profile.avatar=out;
      try{
        save();
        toast('Аватар обновлён','g');
        render();
      }catch(err){
        compressImage(dataUrl,200,0.7,function(out2){
          state.profile.avatar=out2;
          try{save();toast('Аватар обновлён (сжат)','g');render()}
          catch(e2){toast('Не удалось сохранить','r')}
        });
      }
    });
  };
  reader.onerror=()=>toast('Ошибка чтения файла','r');
  reader.readAsDataURL(file);
});
function compressImage(dataUrl,maxSize,quality,cb){
  const img=new Image();
  img.onload=function(){
    const scale=Math.min(1,maxSize/Math.max(img.width,img.height));
    const w=Math.round(img.width*scale);
    const h=Math.round(img.height*scale);
    const c=document.createElement('canvas');
    c.width=w;c.height=h;
    const ctx=c.getContext('2d');
    ctx.drawImage(img,0,0,w,h);
    try{
      const out=c.toDataURL('image/jpeg',quality);
      cb(out);
    }catch(e){cb(dataUrl)}
  };
  img.onerror=function(){cb(dataUrl)};
  img.src=dataUrl;
}

function payDebt(id){
  const d=state.debts.find(x=>x.id===id);if(!d||d.status==='closed')return;
  openSheet('Внести платёж',`
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px">
      Долг: <b style="color:var(--text)">${esc(d.name)}</b> · остаток ${money(d.balance)}
    </div>
    <div class="field"><label>Сумма</label>
      <input name="amount" type="text" inputmode="decimal" value="${d.minPayment}" required></div>
    <div class="field"><label>Дата</label>
      <input name="date" type="date" value="${todayISO()}"></div>
  `,data=>{
    const amt=Math.abs(parseAmount(data.amount)||0);
    if(amt<=0)return;
    const interest=debtInterest(d);
    const bodyPart=Math.max(0,Math.min(amt-interest,d.balance));
    d.balance=Math.max(0,d.balance-bodyPart);
    d.payments=d.payments||[];
    d.payments.push({date:data.date,amount:amt,body:bodyPart,interest:Math.min(interest,amt)});
    if(d.balance<=0)d.status='closed';
    state.operations.push({id:uid(),type:'expense',amount:amt,date:data.date,
      accountId:d.accountId,category:d.type==='Ипотека'?'Жильё':'Другое',
      comment:'Платёж «'+d.name+'»',status:'done',createdAt:Date.now()});
    save();render();toast('Платёж внесён','g');
  });
}

function goalTopup(id){

  const src=$(`[data-goal-src="${g.id}"]`).value;
  const inp=$(`[data-goal-amt="${g.id}"]`);
  const amt=Math.abs(parseAmount(inp.value)||0);
  if(amt<=0){toast('Введите сумму','r');return}
  g.saved+=amt;
  state.operations.push({id:uid(),type:'transfer',amount:amt,date:todayISO(),
    accountId:src,toAccountId:g.accountId,
    comment:'Пополнение «'+g.name+'»',status:'done',createdAt:Date.now()});
  save();render();toast('Цель пополнена','g');
}

    <div class="field"><label>Сумма (для операции)</label>
      <input name="amount" type="text" inputmode="decimal" placeholder="0"></div>
    <div id="calOpFields">
      <div class="field"><label>Тип операции</label>
        <select name="opType">
          <option value="expense">Расход</option>
          <option value="income">Доход</option>
        </select></div>
      <div class="field"><label>Категория</label>
        <select name="category">${catOptions('expense')}</select></div>
      <div class="field"><label>Счёт</label>
        <select name="accountId">${accOpts}</select></div>
    </div>
    <div class="field"><label>Комментарий</label>
      <input name="comment"></div>
    <input type="hidden" name="date" value="${date}">
  `,data=>{
    if(data.kind==='event'||!data.amount||!parseAmount(data.amount)){
      state.events.push({
        id:uid(),date:data.date,title:data.title.trim(),
        comment:(data.comment||'').trim(),amount:parseAmount(data.amount)||0
      });
      save();render();toast('Событие добавлено','g');
      return;
    }
    const amount=Math.abs(parseAmount(data.amount));
    state.operations.push({
      id:uid(),type:data.opType,amount,date:data.date,
      accountId:data.accountId,category:data.category,
      comment:data.title.trim()+(data.comment?' ('+data.comment+')':''),
      status:'done',createdAt:Date.now()
    });
    save();render();toast('Операция добавлена','g');
  });
  setTimeout(()=>{
    const seg=$('#calKind');if(!seg)return;
    const hidden=seg.parentElement.querySelector('[name=kind]');
    const opFields=$('#calOpFields');
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      hidden.value=b.dataset.ck;
      opFields.style.display=b.dataset.ck==='event'?'none':'';
    });
  },60);
}

function exportJSON(){

  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='qarajat-'+todayISO()+'.json';

  toast('JSON скачан','g');
}
function exportCSV(){
  const rows=[['date','type','amount','account','category','comment','status']];
  state.operations.forEach(o=>{
    const acc=state.accounts.find(a=>a.id===o.accountId);
    rows.push([o.date,o.type,o.amount,acc?acc.name:'',o.category||'',o.comment||'',o.status]);
  });
  const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='qarajat-ops-'+todayISO()+'.csv';
  a.click();a.remove();
  toast('CSV скачан','g');
}
function importJSON(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.accounts||!data.operations)throw new Error('bad');
      state=data;
      if(!state.events)state.events=[];
      if(!state.ui)state.ui={tab:'dashboard',aiChat:[],filters:{}};
      if(!state.ui.aiChat)state.ui.aiChat=[];
      if(!state.categories)state.categories=defaultCategories();
      if(!state.aiSettings)state.aiSettings={enabled:true,language:'ru'};
      save();render();toast('Импорт успешен','g');
    }catch(err){toast('Не удалось загрузить файл','r')}
  };
  reader.readAsText(file);
}

/* ============================================================
   AI
   ============================================================ */
const AI=(function(){
  function hasAccess(){return state.aiSettings&&state.aiSettings.enabled}
  function deny(){return 'Извини, доступ к данным отключён.'}
  function detect(t){
    t=t.toLowerCase();
    const kk=/[әғқңөұүһі]/.test(t)||/\b(қанша|неше|бюджет|қарыз|мақсат|жинақ)\b/.test(t);
    const has=(...w)=>w.some(x=>t.includes(x));
    if(has('score','скор','рейтинг'))return{intent:'score',lang:kk?'kk':'ru'};
    if(has('safe','стс','тратить сегодня'))return{intent:'sts',lang:kk?'kk':'ru'};
    if(has('долг','кредит','займ','қарыз'))return{intent:'debt',lang:kk?'kk':'ru'};
    if(has('цел','машина','накоп','мақсат'))return{intent:'goals',lang:kk?'kk':'ru'};
    if(has('расход','трат','шығыс'))return{intent:'expense',lang:kk?'kk':'ru'};
    if(has('доход','зарплат','түсім'))return{intent:'income',lang:kk?'kk':'ru'};
    if(has('необычн','странн','аномал'))return{intent:'unusual',lang:kk?'kk':'ru'};
    if(has('прогноз','болжам'))return{intent:'forecast',lang:kk?'kk':'ru'};
    if(has('бюджет','план','жоспар'))return{intent:'budget',lang:kk?'kk':'ru'};
    if(has('совет','что делать','кеңес'))return{intent:'advice',lang:kk?'kk':'ru'};
    if(has('баланс','сколько денег'))return{intent:'balance',lang:kk?'kk':'ru'};
    if(has('привет','сәлем','hello'))return{intent:'greet',lang:kk?'kk':'ru'};
    if(has('помощь','что умеешь','команды'))return{intent:'help',lang:kk?'kk':'ru'};
    return {intent:'unknown',lang:kk?'kk':'ru'};
  }
  function unusual(){
    const exp=state.operations.filter(o=>o.type==='expense'&&o.status==='done');
    if(exp.length<5)return [];
    const mean=exp.reduce((s,o)=>s+o.amount,0)/exp.length;
    const sd=Math.sqrt(exp.reduce((s,o)=>s+Math.pow(o.amount-mean,2),0)/exp.length)||1;
    const th=mean+2.5*sd;
    return exp.filter(o=>o.amount>th&&o.amount>5000).sort((a,b)=>b.amount-a.amount).slice(0,5);
  }
  const T={
    ru:{
      greet:()=>`Сәлем! Я Алдар-Косе — твой финансовый помощник.\n\nСпроси меня про:\n• Safe-to-spend\n• Score\n• долги и платежи\n• цели\n• необычные расходы\n• прогноз до зарплаты`,
      help:()=>`Умею:\n• Объяснять Safe-to-spend и Score\n• Анализировать доходы, расходы, долги, цели\n• Находить необычные траты\n• Строить прогноз\n• Помогать с бюджетом`,
      score:()=>{const M=metrics();
        let s=`Qarajat Score: ${M.score}/100 — ${scoreLabel(M.score)}.\n\n`;
        M.scoreBreakdown.factors.forEach(f=>{s+=`• ${f.name}: ${f.value} — ${f.desc}\n`});
        return s},
      sts:()=>{const M=metrics();
        return `Safe-to-spend — сколько можно потратить сегодня.\n\n`+
          `• Доступно: ${money(M.avail)}\n`+
          `• Платежи: −${money(M.upcomingBeforeSalary)}\n`+
          `• План: −${money(M.plannedExpenses)}\n`+
          `• Резерв: −${money(M.reserve)}\n`+
          `• Дней: ${M.daysLeft}\n\n`+
          `👉 Безопасно: ${money(M.safeToSpend)}`},
      debt:()=>{const M=metrics();
        const a=state.debts.filter(d=>d.status!=='closed');
        if(!a.length)return 'Активных долгов нет! 🎉';
        let s=`Долгов: ${a.length}. Общий остаток: ${money(M.debtTotal)}.\n`;
        s+=`В месяц: ${money(M.debtMonthly)} (${M.debtLoad.toFixed(0)}% дохода).\n\n`;
        a.forEach(d=>{const m=debtMonths(d);
          s+=`• ${d.name}: ${money(d.balance)} · ${m===Infinity?'∞':m+' мес.'}\n`});
        return s},
      goals:()=>{if(!state.goals.length)return 'Целей нет.';
        return state.goals.map(g=>`${g.emoji} ${g.name}: ${(g.saved/g.target*100).toFixed(0)}% · ${money(g.target-g.saved)}`).join('\n')},
      expense:()=>{const c=aggRange('month');
        if(!c.exp)return 'Расходов нет.';
        const cats={};c.done.filter(o=>o.type==='expense').forEach(o=>{cats[o.category]=(cats[o.category]||0)+o.amount});
        const arr=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);
        return `Расходы: ${money(c.exp)}\n\nТоп-5:\n`+arr.map(([n,v])=>`• ${n}: ${money(v)}`).join('\n')},
      income:()=>{const c=aggRange('month');
        return `Доход за 30 дней: ${money(c.inc)}`},
      unusual:()=>{const u=unusual();
        if(!u.length)return 'Необычных трат нет.';
        return 'Крупные траты:\n\n'+u.map(o=>`• ${fmtDate(o.date)} — ${o.category}: ${money(o.amount)}`).join('\n')},
      forecast:()=>{const M=metrics();
        return `Прогноз до зарплаты (${M.daysLeft} дн.):\n\n`+
          `• Сейчас: ${money(M.avail)}\n`+
          `• Обязательное: −${money(M.upcomingBeforeSalary+M.plannedExpenses+M.recBeforeSalary)}\n`+
          `• Остаток: ${money(M.forecast)}`},
      budget:()=>{const c=aggRange('month');
        if(c.inc<=0)return 'Недостаточно данных.';
        return `Бюджет (доход ${money(c.inc)}):\n\n`+
          `• Обязательное (50%): ${money(c.inc*0.5)}\n`+
          `• Желания (30%): ${money(c.inc*0.3)}\n`+
          `• Сбережения (20%): ${money(c.inc*0.2)}`},
      advice:()=>{const M=metrics();const tips=[];
        if(M.safeToSpend<1000)tips.push('Safe-to-spend низкий — избегай лишних трат.');
        if(M.debtLoad>30)tips.push('Долговая нагрузка высокая.');
        if(M.savingsRate<10)tips.push('Savings Rate <10%. Откладывай больше.');
        if(M.cushionMonths<3)tips.push('Подушка < 3 мес.');
        const u=unusual();
        if(u.length)tips.push(`Нашёл ${u.length} необычно крупных трат.`);
        if(!tips.length)tips.push('Финансы в порядке! 🎉');
        return 'Советы:\n\n'+tips.map(t=>'• '+t).join('\n')},
      balance:()=>{const M=metrics();
        return `Баланс: ${money(M.netWorth)}\n\n`+
          `• Доступно: ${money(M.avail)}\n`+
          `• Накопления: ${money(M.savings)}\n`+
          `• Долги: −${money(M.debtTotal)}`},
      unknown:()=>'Не понял вопрос. Спроси про Safe-to-spend, Score, долги, цели, расходы, прогноз или бюджет.'
    },
    kk:{
      greet:()=>'Сәлем! Мен Алдар-Косе — қаржы көмекшіңмін.',
      help:()=>'Кіріс, шығыс, қарыз, мақсат талдай аламын.',
      score:()=>{const M=metrics();return `Score: ${M.score}/100.`},
      sts:()=>{const M=metrics();return `Бүгін: ${money(M.safeToSpend)}.`},
      debt:()=>{const M=metrics();return `Қарыз: ${money(M.debtTotal)}.`},
      goals:()=>state.goals.map(g=>`${g.emoji} ${g.name}`).join('\n')||'Мақсаттар жоқ.',
      expense:()=>{const c=aggRange('month');return `Шығыс: ${money(c.exp)}.`},
      income:()=>{const c=aggRange('month');return `Кіріс: ${money(c.inc)}.`},
      unusual:()=>{const u=unusual();return u.length?'Бар: '+u.length:'Жоқ.'},
      forecast:()=>{const M=metrics();return `Болжам: ${money(M.forecast)}.`},
      budget:()=>{const c=aggRange('month');return `Бюджет: ${money(c.inc)}.`},
      advice:()=>'Кеңес: жинақтауды ұлғайт.',
      balance:()=>{const M=metrics();return `Баланс: ${money(M.netWorth)}.`},
      unknown:()=>'Түсінбедім.'
    }
  };
  return {
    ask(text){
      if(!hasAccess())return {text:deny(),source:'access off'};
      const {intent,lang}=detect(text);
      const L=T[lang]||T.ru;
      const fn=L[intent]||T.ru[intent]||T.ru.unknown;
      return {text:fn(),source:intent};
    }
  };
})();

function renderAIBody(){
  const chat=state.ui.aiChat||[];
  $('#aiBody').innerHTML=chat.length?chat.map(m=>`
    <div class="ai-msg ${m.role}">
      ${m.role==='bot'?'<b>Алдар-Косе:</b> ':''}${esc(m.text).replace(/\n/g,'<br>')}
      ${m.source&&m.role==='bot'?`<span class="src">${esc(m.source)}</span>`:''}
    </div>
  `).join(''):`
    <div class="ai-msg bot">
      <b>Алдар-Косе:</b> Сәлем! 👋<br><br>
      Я твой финансовый помощник. Спроси про <b>Safe-to-spend</b>,
      <b>Score</b>, долги, цели, прогноз или бюджет.
    </div>`;
  const suggs=['Safe-to-spend','Score','Долги','Цели','Расходы','Прогноз','Бюджет','Советы'];
  $('#aiSugg').innerHTML=suggs.map(s=>`<button data-ai-q="${s}" type="button">${s}</button>`).join('');
  $$('[data-ai-q]').forEach(b=>b.onclick=()=>sendAI(b.dataset.aiQ));
  setTimeout(()=>{const b=$('#aiBody');if(b)b.scrollTop=b.scrollHeight},50);
}
function sendAI(text){
  if(!text||!text.trim())return;
  if(!state.ui.aiChat)state.ui.aiChat=[];
  state.ui.aiChat.push({role:'user',text:text.trim()});
  const r=AI.ask(text);
  state.ui.aiChat.push({role:'bot',text:r.text,source:r.source});
  if(state.ui.aiChat.length>40)state.ui.aiChat=state.ui.aiChat.slice(-40);
  save();renderAIBody();
}

/* ============================================================
   INIT
   ============================================================ */
$('#aiFab').onclick=openAISheet;
$('#aiClose').onclick=closeAISheet;
$('#aiSend').onclick=()=>{const v=$('#aiInput').value;if(v){sendAI(v);$('#aiInput').value=''}};
$('#aiInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();
    const v=e.target.value;if(v){sendAI(v);e.target.value=''}}
});

try{
  history.replaceState({tab:state.ui.tab||'dashboard'},'','#'+(state.ui.tab||'dashboard'));
}catch(e){}

if(location.hash&&location.hash.length>1){
  const t=location.hash.slice(1);
  if(TITLES[t])state.ui.tab=t;
}

render();
})();
</script>
</body>
  <script>
(function () {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .catch(function (e) { console.warn('SW failed', e); });
    });
  }

  var btn = document.getElementById('qarajat-install-btn');
  if (!btn) return;

  var prompt = null;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                  || window.navigator.standalone === true;

  if (isStandalone) return;
  if (isIOS) btn.style.display = 'block';

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    prompt = e;
    btn.style.display = 'block';
  });

  btn.addEventListener('click', function () {
    if (prompt) {
      prompt.prompt();
      prompt.userChoice.then(function () {
        btn.style.display = 'none';
        prompt = null;
      });
      return;
    }
    if (isIOS) {
      alert('iPhone:\n\n1. Нажмите «Поделиться» (квадрат со стрелкой).\n2. Выберите «На экран Домой».\n3. Нажмите «Добавить».');
      return;
    }
    alert('Откройте меню браузера (⋮) и выберите:\n\n«Установить приложение»\nили «Добавить на главный экран».');
  });

  window.addEventListener('appinstalled', function () {
    btn.style.display = 'none';
  });
})();
</script>
