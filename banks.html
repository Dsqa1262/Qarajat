<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Банки — Qarajat</title>
  <meta name="theme-color" content="#0b2b1e">
  <link rel="manifest" href="./manifest.json">
</head>
<body style="margin:0;background:#0b2b1e;color:#fff;">
  <script src="./banks.js"></script>
  <script>
    // Принудительно открываем экран «Банки» сразу после загрузки
    document.addEventListener('DOMContentLoaded', function() {
      if (window.QarajatBanks) {
        window.QarajatBanks.open();
      } else {
        // Если по какой-то причине модуль не загрузился, покажем сообщение
        document.body.innerHTML = '<div style="padding:20px;text-align:center;">Не удалось загрузить модуль «Банки». Проверьте наличие файла banks.js.</div>';
      }
    });
  </script>
</body>
</html>
